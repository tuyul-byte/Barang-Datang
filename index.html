<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Barang Datang Supplier - Android View</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (XLSX) Library untuk Ekspor Excel Asli -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Mengatur tampilan agar menyerupai layar perangkat Android / Mobile */
        body {
            background-color: #eef2f5;
            font-size: 0.82rem; /* Ukuran font keseluruhan lebih kecil ala mobile */
        }
        .mobile-container {
            max-width: 720px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .app-header {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            padding: 16px 20px;
            text-align: center;
        }
        .app-header h4 { font-size: 1.15rem; font-weight: 700; margin-bottom: 2px; }
        .app-header p { font-size: 0.75rem; opacity: 0.85; margin-bottom: 8px; }

        /* Kompak form dan input */
        .form-label { font-size: 0.78rem; font-weight: 600; margin-bottom: 2px; }
        .form-control, .form-select { font-size: 0.8rem; padding: 6px 10px; border-radius: 8px; }
        .btn { font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; }

        /* Tabel compact ala android */
        .table-excel { border-color: #dee2e6; }
        .table-excel th {
            background-color: #f1f3f5;
            color: #495057;
            border-bottom: 2px solid #ced4da;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            padding: 6px 8px;
        }
        .table-excel td { 
            font-size: 0.78rem; 
            vertical-align: middle; 
            color: #212529; 
            padding: 4px 8px !important; 
        }
        .table-container { max-height: 420px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 8px; }
        .nav-pills .nav-link { font-size: 0.8rem; padding: 6px 14px; }
        .nav-pills .nav-link.active { background-color: #0d6efd; font-weight: 600; }
        .badge-unit { font-weight: 500; padding: 0.25em 0.5em; font-size: 0.7rem; }
        
        .nama-barang-kolom {
            white-space: nowrap !important;
        }
        
        .connection-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: 50rem;
            background-color: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.connecting { background-color: #ffc107; }
        .status-dot.connected { background-color: #198754; box-shadow: 0 0 6px #198754; }
        .status-dot.error { background-color: #dc3545; }

        /* Modal Android Style */
        .modal-content {
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            font-size: 0.85rem;
        }
        .modal-header { border-bottom: none; padding-bottom: 0; }
        .modal-footer { border-top: none; }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- HEADER & NAVIGASI MENU -->
        <div class="app-header">
            <h4><i class="fas fa-boxes-stacked me-2"></i>Barang Datang Supplier</h4>
            <p>Sistem Manajemen Gudang</p>
            <div id="connectionStatus" class="connection-indicator">
                <span class="status-dot connecting" id="statusDot"></span>
                <span id="statusText">Menghubungkan ke Database...</span>
            </div>
        </div>

        <div class="p-3 bg-white border-bottom text-center">
            <ul class="nav nav-pills justify-content-center gap-2" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active px-3 py-1.5 rounded-pill shadow-sm" id="menu-form-tab" data-bs-toggle="pill" data-bs-target="#menu-form" type="button" role="tab">
                        <i class="fas fa-pen-to-square me-1"></i>Form Input
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link px-3 py-1.5 rounded-pill shadow-sm" id="menu-riwayat-tab" data-bs-toggle="pill" data-bs-target="#menu-riwayat" type="button" role="tab">
                        <i class="fas fa-table-list me-1"></i>Menu Riwayat
                    </button>
                </li>
            </ul>
        </div>

        <!-- KONTEN MENU -->
        <div class="tab-content p-3" id="pills-tabContent">
            
            <!-- 1. MENU FORM INPUT -->
            <div class="tab-pane fade show active" id="menu-form" role="tabpanel">
                <div class="card border-0 shadow-sm rounded-4 bg-light">
                    <div class="card-body p-3">
                        <form id="formBarangDatang" onsubmit="handleTambahData(event)">
                            <input type="hidden" id="editId">
                            <div class="row g-2">
                                <div class="col-6 mb-2">
                                    <label for="tanggal" class="form-label">Tanggal <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="tanggal" required>
                                </div>
                                <div class="col-6 mb-2">
                                    <label for="supplier" class="form-label">Supplier <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="supplier" placeholder="Nama supplier" required>
                                </div>
                            </div>
                            <div class="row g-2">
                                <div class="col-6 mb-2">
                                    <label for="namaBarang" class="form-label">Nama Barang <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="namaBarang" placeholder="Nama barang" required>
                                </div>
                                <div class="col-6 mb-2">
                                    <label for="noPo" class="form-label">No. PO <span class="text-muted">(Opsional)</span></label>
                                    <input type="text" class="form-control" id="noPo" placeholder="No PO">
                                </div>
                            </div>
                            <div class="row g-2">
                                <div class="col-4 mb-2">
                                    <label for="noSj" class="form-label">No. SJ <span class="text-muted">(Opsional)</span></label>
                                    <input type="text" class="form-control" id="noSj" placeholder="No SJ">
                                </div>
                                <div class="col-4 mb-2">
                                    <label for="qty" class="form-label">QTY <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="qty" min="1" placeholder="Jumlah" required>
                                </div>
                                <div class="col-4 mb-2">
                                    <label for="unit" class="form-label">Unit <span class="text-danger">*</span></label>
                                    <select class="form-select" id="unit" required>
                                        <option value="" disabled selected>Pilih</option>
                                        <option value="pcs">Pcs</option>
                                        <option value="pack">Pack</option>
                                        <option value="kg">Kg</option>
                                        <option value="roll">Roll</option>
                                        <option value="sheet">Sheet</option>
                                    </select>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end gap-2 mt-3">
                                <button type="button" class="btn btn-outline-secondary px-3" onclick="resetForm()"><i class="fas fa-undo me-1"></i> Reset</button>
                                <button type="submit" class="btn btn-primary px-3" id="btnSimpan">
                                    <span id="btnSimpanText"><i class="fas fa-save me-1"></i> Simpan</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 2. MENU RIWAYAT DATA -->
            <div class="tab-pane fade" id="menu-riwayat" role="tabpanel">
                <div class="card border-0 shadow-sm rounded-4 bg-light">
                    <div class="card-header bg-dark text-white py-2 px-3 rounded-top-4 d-flex justify-content-between align-items-center gap-2">
                        <div class="d-flex align-items-center gap-1">
                            <span class="fs-7 fw-semibold">Riwayat Data</span>
                            <span class="badge bg-primary rounded-pill fs-8" id="totalDataBadge">0</span>
                        </div>
                        <div class="d-flex align-items-center gap-1">
                            <input type="text" id="inputPencarian" class="form-control form-control-sm py-1" style="width: 140px;" placeholder="Cari..." onkeyup="filterTabel()">
                            <button class="btn btn-outline-light btn-sm py-1 px-2" onclick="exportToXLSX()" title="Export XLSX">
                                <i class="fas fa-file-excel text-success"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-2">
                        <div class="table-container table-responsive">
                            <table class="table table-bordered table-hover table-excel align-middle mb-0" id="tabelRiwayat">
                                <thead>
                                    <tr>
                                        <th class="text-center" width="4%">No</th>
                                        <th width="12%">Tgl</th>
                                        <th width="18%">Supplier</th>
                                        <th>Nama Barang</th>
                                        <th width="14%">No. PO</th>
                                        <th width="14%">No. SJ</th>
                                        <th class="text-center" width="8%">QTY</th>
                                        <th class="text-center" width="6%">Unit</th>
                                        <th class="text-center" width="4%">Edit</th>
                                    </tr>
                                </thead>
                                <tbody id="barisDataRiwayat">
                                    <tr><td colspan="9" class="text-center text-muted py-3">Memuat data...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2 text-muted fs-8 px-1">
                            <span id="infoJumlahBaris">Semua data</span>
                            <span>Database Realtime</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- MODAL ANDROID STYLE -->
    <div class="modal fade" id="androidModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content p-2">
                <div class="modal-header py-1">
                    <h6 class="modal-title fw-bold text-primary" id="androidModalTitle"><i class="fas fa-info-circle me-1"></i>Informasi</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-2">
                    <p id="androidModalMessage" class="mb-0 text-secondary fs-8">Pesan...</p>
                </div>
                <div class="modal-footer pt-0 pb-1" id="androidModalFooter">
                    <button type="button" class="btn btn-primary btn-sm rounded-pill px-3" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- FIREBASE REALTIME DATABASE SDK & LOGIKA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, update, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // GANTI DENGAN KONFIGURASI FIREBASE ANDA
        // ==========================================
        const firebaseConfig = {
  apiKey: "AIzaSyA_QcHO8eB6JsJZslr9kFDLIhgZu0cXHBI",
  authDomain: "material-incomming.firebaseapp.com",
  databaseURL: "https://material-incomming-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "material-incomming",
  storageBucket: "material-incomming.firebasestorage.app",
  messagingSenderId: "323944053500",
  appId: "1:323944053500:web:b800addbf65b915dd33579"
};

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        function updateConnectionStatus(status, message) {
            statusDot.className = 'status-dot ' + status;
            statusText.textContent = message;
        }

        function formatTanggalID(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        window.showAndroidAlert = function(title, message, isError = false) {
            document.getElementById('androidModalTitle').innerHTML = isError ? 
                '<i class="fas fa-exclamation-circle me-1 text-danger"></i>Perhatian' : 
                '<i class="fas fa-check-circle me-1 text-success"></i>Sukses';
            document.getElementById('androidModalMessage').textContent = message;
            document.getElementById('androidModalFooter').innerHTML = `
                <button type="button" class="btn btn-primary btn-sm rounded-pill px-3" data-bs-dismiss="modal">OK</button>
            `;
            const modal = new bootstrap.Modal(document.getElementById('androidModal'));
            modal.show();
        };

        const isConfigValid = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("MASUKKAN_");

        if (!isConfigValid) {
            updateConnectionStatus('error', 'Konfigurasi Firebase belum diisi');
            document.getElementById('barisDataRiwayat').innerHTML = `
                <tr><td colspan="9" class="text-center text-danger py-3">
                    <i class="fas fa-exclamation-triangle fa-lg mb-1"></i><br>
                    Harap masukkan konfigurasi Firebase!
                </td></tr>
            `;
        } else {
            let app, db;
            try {
                app = initializeApp(firebaseConfig);
                db = getDatabase(app);
                updateConnectionStatus('connecting', 'Menghubungkan...');

                document.getElementById('tanggal').valueAsDate = new Date();
                let dataRiwayat = [];

                window.handleTambahData = async function(event) {
                    event.preventDefault();
                    const btnSimpan = document.getElementById('btnSimpan');
                    const btnText = document.getElementById('btnSimpanText');
                    const editId = document.getElementById('editId').value;
                    
                    btnSimpan.disabled = true;
                    btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Simpan...';

                    try {
                        const valNoPo = document.getElementById('noPo').value.trim();
                        const valNoSj = document.getElementById('noSj').value.trim();

                        const dataPayload = {
                            tanggal: document.getElementById('tanggal').value,
                            supplier: document.getElementById('supplier').value,
                            namaBarang: document.getElementById('namaBarang').value,
                            noPo: valNoPo !== "" ? valNoPo : "-",
                            noSj: valNoSj !== "" ? valNoSj : "-",
                            qty: Number(document.getElementById('qty').value),
                            unit: document.getElementById('unit').value
                        };

                        if (editId) {
                            const itemRef = ref(db, 'barang_datang/' + editId);
                            await update(itemRef, dataPayload);
                            showAndroidAlert("Berhasil", "Data diperbarui!");
                        } else {
                            dataPayload.createdAt = Date.now();
                            const dbRef = ref(db, 'barang_datang');
                            await push(dbRef, dataPayload);
                            showAndroidAlert("Berhasil", "Data disimpan!");
                        }

                        resetForm();
                    } catch (error) {
                        console.error("Gagal: ", error);
                        showAndroidAlert("Gagal", "Kesalahan: " + error.message, true);
                    } finally {
                        btnSimpan.disabled = false;
                        btnText.innerHTML = '<i class="fas fa-save me-1"></i> Simpan';
                    }
                };

                window.resetForm = function() {
                    document.getElementById('formBarangDatang').reset();
                    document.getElementById('editId').value = '';
                    document.getElementById('tanggal').valueAsDate = new Date();
                    document.getElementById('btnSimpanText').innerHTML = '<i class="fas fa-save me-1"></i> Simpan';
                };

                const dbRef = query(ref(db, 'barang_datang'), orderByChild('createdAt'));
                onValue(dbRef, (snapshot) => {
                    dataRiwayat = [];
                    snapshot.forEach((childSnap) => {
                        dataRiwayat.push({
                            id: childSnap.key,
                            ...childSnap.val()
                        });
                    });
                    
                    renderTabel(dataRiwayat);
                    updateConnectionStatus('connected', 'Terhubung (Live)');
                }, (error) => {
                    console.error("Koneksi error: ", error);
                    updateConnectionStatus('error', 'Koneksi Terputus');
                });

                window.renderTabel = function(data) {
                    const tbody = document.getElementById('barisDataRiwayat');
                    tbody.innerHTML = '';
                    document.getElementById('totalDataBadge').textContent = dataRiwayat.length;

                    if (data.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="9" class="text-center text-muted py-4">
                                    <i class="fas fa-folder-open fa-lg mb-1 text-secondary"></i><br>
                                    Belum ada data.
                                </td>
                            </tr>
                        `;
                        document.getElementById('infoJumlahBaris').textContent = 'Kosong';
                        return;
                    }

                    const groupedData = {};
                    data.forEach(item => {
                        const poKey = item.noPo || '-';
                        if (!groupedData[poKey]) {
                            groupedData[poKey] = [];
                        }
                        groupedData[poKey].push(item);
                    });

                    let globalIndex = 1;

                    for (const [poNumber, items] of Object.entries(groupedData)) {
                        const groupHeaderTr = document.createElement('tr');
                        groupHeaderTr.className = 'table-secondary fw-bold';
                        groupHeaderTr.innerHTML = `
                            <td colspan="9" class="py-1 text-primary fs-8">
                                <i class="fas fa-folder-open me-1"></i>No. PO: ${escapeHtml(poNumber)} (${items.length})
                            </td>
                        `;
                        tbody.appendChild(groupHeaderTr);

                        items.forEach((item) => {
                            let badgeColor = 'bg-secondary';
                            const unitLower = item.unit ? item.unit.toLowerCase() : '';
                            if (unitLower === 'pcs') badgeColor = 'bg-primary';
                            else if (unitLower === 'pack') badgeColor = 'bg-success';
                            else if (unitLower === 'kg') badgeColor = 'bg-warning text-dark';
                            else if (unitLower === 'roll') badgeColor = 'bg-info text-dark';
                            else if (unitLower === 'sheet') badgeColor = 'bg-danger';

                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td class="text-center text-muted fw-bold">${globalIndex++}</td>
                                <td>${formatTanggalID(item.tanggal)}</td>
                                <td><span class="fw-semibold text-dark">${escapeHtml(item.supplier)}</span></td>
                                <td class="nama-barang-kolom"><strong>${escapeHtml(item.namaBarang)}</strong></td>
                                <td><code>${escapeHtml(item.noPo)}</code></td>
                                <td><code>${escapeHtml(item.noSj)}</code></td>
                                <td class="text-center fw-bold">${Number(item.qty).toLocaleString()}</td>
                                <td class="text-center"><span class="badge ${badgeColor} badge-unit text-uppercase">${item.unit}</span></td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary border-0 p-0 px-1" onclick="muatDataEdit('${item.id}')" title="Edit">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }

                    document.getElementById('infoJumlahBaris').textContent = `Ditampilkan ${data.length} dari ${dataRiwayat.length}`;
                };

                window.muatDataEdit = function(id) {
                    const item = dataRiwayat.find(d => d.id === id);
                    if (!item) return;

                    document.getElementById('editId').value = item.id;
                    document.getElementById('tanggal').value = item.tanggal;
                    document.getElementById('supplier').value = item.supplier;
                    document.getElementById('namaBarang').value = item.namaBarang;
                    document.getElementById('noPo').value = item.noPo !== '-' ? item.noPo : '';
                    document.getElementById('noSj').value = item.noSj !== '-' ? item.noSj : '';
                    document.getElementById('qty').value = item.qty;
                    document.getElementById('unit').value = item.unit;

                    document.getElementById('btnSimpanText').innerHTML = '<i class="fas fa-sync-alt me-1"></i> Update';

                    const formTab = new bootstrap.Tab(document.getElementById('menu-form-tab'));
                    formTab.show();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };

                window.filterTabel = function() {
                    const keyword = document.getElementById('inputPencarian').value.toLowerCase();
                    const filteredData = dataRiwayat.filter(item => {
                        return (
                            (item.tanggal && item.tanggal.toLowerCase().includes(keyword)) ||
                            (item.supplier && item.supplier.toLowerCase().includes(keyword)) ||
                            (item.namaBarang && item.namaBarang.toLowerCase().includes(keyword)) ||
                            (item.noPo && item.noPo.toLowerCase().includes(keyword)) ||
                            (item.noSj && item.noSj.toLowerCase().includes(keyword)) ||
                            (item.unit && item.unit.toLowerCase().includes(keyword))
                        );
                    });
                    renderTabel(filteredData);
                };

                window.exportToXLSX = function() {
                    if (dataRiwayat.length === 0) {
                        showAndroidAlert("Perhatian", "Tidak ada data!", true);
                        return;
                    }

                    const dataFormatted = dataRiwayat.map((item, index) => ({
                        "No": index + 1,
                        "Tanggal": formatTanggalID(item.tanggal),
                        "Supplier": item.supplier,
                        "Nama Barang": item.namaBarang,
                        "No. PO": item.noPo,
                        "No. SJ": item.noSj,
                        "QTY": Number(item.qty),
                        "Unit": item.unit.toUpperCase()
                    }));

                    const worksheet = XLSX.utils.json_to_sheet(dataFormatted);
                    worksheet['!cols'] = [
                        { wch: 5 }, { wch: 12 }, { wch: 20 }, { wch: 35 },
                        { wch: 18 }, { wch: 18 }, { wch: 10 }, { wch: 10 }
                    ];

                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Riwayat Barang Datang");
                    XLSX.writeFile(workbook, "Riwayat_Barang_Datang_" + new Date().toISOString().slice(0, 10) + ".xlsx");
                };

                function escapeHtml(text) {
                    if (!text) return '';
                    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                    return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
                }

            } catch (error) {
                console.error("Init error:", error);
                updateConnectionStatus('error', 'Gagal memuat Database');
            }
        }
    </script>
</body>
</html>
